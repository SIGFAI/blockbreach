[package]
name = "blockbreach"
version = "1.0.0"
edition = "2021"
description = "BlockBreach: Ready or Not x Minecraft - installer and launcher"
build = "build.rs"

[[bin]]
name = "BlockBreach"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
